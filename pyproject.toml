[project]
name = "fuzzpipe"
version = "2.2.0"
description = "Deterministic orchestration CLI for AI-driven EVM/Solidity invariant fuzzing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.8",
    "structlog>=24.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff", "mypy", "prometheus-client"]

[project.entry-points]
fuzzpipe.engines = [
    "forge = fuzzpipe.engines.adapters.forge:ForgeAdapter",
    "medusa = fuzzpipe.engines.adapters.medusa:MedusaAdapter",
    "echidna = fuzzpipe.engines.adapters.echidna:EchidnaAdapter",
    "halmos = fuzzpipe.engines.adapters.halmos:HalmosAdapter",
]

[project.scripts]
fuzzpipe = "fuzzpipe.cli.app:app"

[tool.uv]
dev-dependencies = ["pytest", "pytest-asyncio", "hypothesis", "ruff", "mypy", "prometheus-client"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "ARG", "PTH", "TRY", "TID", "ERA"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"